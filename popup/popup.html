<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zagyva</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <h1 class="title">Zagyva</h1>
      <p class="subtitle">Hide 2026 election content</p>
    </header>
    <section class="section">
      <h2 class="section-title">Sites</h2>
      <div id="site-toggles" class="toggles"></div>
    </section>
    <section class="section">
      <h2 class="section-title">Keywords</h2>
      <p class="hint">One keyword per line. Matching is case- and accent-insensitive.</p>
      <textarea id="keywords-input" class="keywords-input" rows="6" placeholder="Add or edit keywords..."></textarea>
      <div class="buttons">
        <button id="save-keywords" class="btn btn-primary">Save</button>
        <button id="reset-keywords" class="btn btn-secondary">Reset to defaults</button>
      </div>
    </section>
    <section class="section stats">
      <p class="stat">
        <span id="hidden-count">0</span> items hidden this session
      </p>
      <button id="reset-count" class="btn btn-small">Reset counter</button>
    </section>
  </div>
  <script src="../src/keywords.js"></script>
  <script src="popup.js"></script>
</body>
</html>
